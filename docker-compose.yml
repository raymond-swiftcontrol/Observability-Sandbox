# Local development infrastructure for Helios.
# Application services run on the host (make dev) for fast reload; everything
# stateful runs here. See docker-compose.observability.yml for the o11y stack
# and docker-compose.apps.yml for running the services containerised.
name: helios

x-healthcheck-defaults: &hc
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  # ── Primary OLTP + time-series store ──────────────────────────────────────
  postgres:
    image: timescale/timescaledb-ha:pg16.4-ts2.17.2
    container_name: helios-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - max_connections=300
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=250ms
    environment:
      POSTGRES_DB: helios
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios_dev_only
      TIMESCALEDB_TELEMETRY: off
    ports: ['5432:5432']
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helios -d helios']
      <<: *hc

  # ── Read replica, used to validate replica-aware query routing ────────────
  postgres-replica:
    image: timescale/timescaledb-ha:pg16.4-ts2.17.2
    container_name: helios-postgres-replica
    profiles: ['ha']
    environment:
      PGDATA: /home/postgres/pgdata/data
      POSTGRES_PASSWORD: helios_dev_only
      PRIMARY_HOST: postgres
    ports: ['5433:5432']
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - pgreplica:/home/postgres/pgdata/data
      - ./scripts/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ['/bin/bash', '/replica-entrypoint.sh']

  # ── Tick archive + analytical queries ─────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: helios-clickhouse
    environment:
      CLICKHOUSE_DB: helios_analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ['8123:8123', '9000:9000']
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
      - ./db/analytics/config:/etc/clickhouse-server/config.d:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'localhost:8123/ping']
      <<: *hc

  # ── Cache, rate limiting, BullMQ, WS fan-out ──────────────────────────────
  redis:
    image: redis/redis-stack-server:7.4.0-v1
    container_name: helios-redis
    command: >
      redis-stack-server --appendonly yes --maxmemory 1gb
      --maxmemory-policy allkeys-lru --notify-keyspace-events Ex
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      <<: *hc

  # ── Event backbone ────────────────────────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.2.9
    container_name: helios-redpanda
    command:
      - redpanda start
      - --smp 2
      - --memory 1800M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
    ports: ['19092:19092', '18081:18081', '18082:18082', '9644:9644']
    volumes: [rpdata:/var/lib/redpanda/data]
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      <<: *hc

  redpanda-init:
    image: redpandadata/redpanda:v24.2.9
    container_name: helios-redpanda-init
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ['/bin/bash', '/init-topics.sh']
    volumes:
      - ./scripts/init-topics.sh:/init-topics.sh:ro
    restart: 'no'

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: helios-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: 'true'
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports: ['8080:8080']
    depends_on:
      redpanda: { condition: service_healthy }

  # ── Object storage: backtest artifacts + parquet feature store ────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: helios-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9100:9000', '9001:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      <<: *hc

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/helios-artifacts local/helios-feature-store local/helios-reports &&
      mc anonymous set download local/helios-reports || true"
    restart: 'no'

  # ── Vendor API simulator: deterministic WS/REST market data for dev ───────
  vendor-sim:
    build:
      context: .
      dockerfile: tools/vendor-sim/Dockerfile
    container_name: helios-vendor-sim
    environment:
      SIM_SEED: '42'
      SIM_SYMBOLS: '500'
      SIM_TICKS_PER_SEC: '2500'
      SIM_REGIME_SCHEDULE: 'trend:600,chop:900,shock:120'
    ports: ['7070:7070']
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'localhost:7070/healthz']
      <<: *hc

  # ── Mail catcher for alert/email testing ──────────────────────────────────
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: helios-mailpit
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
  pgreplica:
  chdata:
  redisdata:
  rpdata:
  miniodata:

networks:
  default:
    name: helios-net
