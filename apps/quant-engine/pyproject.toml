[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-quant-engine"
version = "0.1.0"
description = "Helios quant engine — features, feature store, backtests, optimisation, validation"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear
  "C4",       # comprehensions
  "SIM",      # simplify
  "BLE",      # blind except — permitted only with an explicit noqa and a reason
  "RUF",
  "ANN",      # annotations — the point of mypy --strict is undermined without these
  "N",        # pep8-naming
]
ignore = [
  # Single-letter maths names are the clearest spelling for matrix algebra: a
  # covariance matrix is Sigma, a design matrix is X. Renaming them to
  # `covariance_matrix` makes the formulas harder to check against a paper.
  "N803", "N806",
  "B008",   # FastAPI Depends() in defaults is the framework's idiom
  # Error details and log context are genuinely open-ended key/value bags. The
  # alternative is a TypedDict per call site, which types nothing useful.
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["helios_quant"]
plugins = []
warn_unreachable = true
# numpy's stubs legitimately return Any from several ufunc/reduction overloads
# (np.ndarray.sum, comparison chains on structured dtypes). Raising an error on
# those would push every numeric function through a cast(), which hides real
# type errors rather than exposing them. Annotations on signatures stay strict.
warn_return_any = false

[[tool.mypy.overrides]]
module = ["celery.*", "aiokafka.*", "boto3.*", "botocore.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:helios_quant.*"]
addopts = "--strict-markers"
markers = [
  "golden: golden-file regression tests on the reference strategies",
  "slow: excluded from the default pre-commit run",
]
