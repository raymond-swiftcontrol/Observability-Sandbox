# Observability stack: OTel collector → Tempo (traces) / Prometheus (metrics) /
# Loki (logs), surfaced in Grafana with provisioned dashboards.
name: helios

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: helios-otel-collector
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - '4317:4317'   # OTLP gRPC
      - '4318:4318'   # OTLP HTTP
      - '8889:8889'   # prometheus exporter scrape target
    depends_on: [tempo, loki]

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: helios-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage,native-histograms
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports: ['9090:9090']

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: helios-alertmanager
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ['9093:9093']

  tempo:
    image: grafana/tempo:2.6.1
    container_name: helios-tempo
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports: ['3200:3200']

  loki:
    image: grafana/loki:3.3.1
    container_name: helios-loki
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    ports: ['3100:3100']

  pyroscope:
    image: grafana/pyroscope:1.11.0
    container_name: helios-pyroscope
    ports: ['4040:4040']
    profiles: ['profiling']

  grafana:
    image: grafana/grafana:11.4.0
    container_name: helios-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,metricsSummary
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ['3001:3000']
    depends_on: [prometheus, tempo, loki]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: helios-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://helios:helios_dev_only@postgres:5432/helios?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pg-queries.yaml
    volumes:
      - ./infra/observability/pg-exporter-queries.yaml:/etc/pg-queries.yaml:ro
    ports: ['9187:9187']

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: helios-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports: ['9121:9121']

  k6:
    image: grafana/k6:0.55.0
    container_name: helios-k6
    profiles: ['loadtest']
    entrypoint: ['sleep', 'infinity']
    volumes:
      - ./scripts/load:/scripts:ro
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write

volumes:
  promdata:
  tempodata:
  lokidata:
  grafanadata:
